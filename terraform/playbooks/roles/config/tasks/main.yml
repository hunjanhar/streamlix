---
- name: Update apt packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install dependencies
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
    state: present

- name: Check if K3s binary exists
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s via official script
  shell: |
    curl -sfL https://get.k3s.io | sh -
  when: not k3s_binary.stat.exists

- name: Ensure K3s service is started and enabled
  service:
    name: k3s
    state: started
    enabled: yes

- name: Configure kubeconfig permissions for user
  block:
    - name: Create .kube directory for user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Copy K3s kubeconfig to user's home directory
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

- name: Add KUBECONFIG to ubuntu user bashrc
  lineinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    line: "export KUBECONFIG=~/.kube/config"
    state: present
    insertafter: EOF

- name: Verify K3s is ready and node is online
  shell: kubectl get nodes
  become: no
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  register: kubectl_status
  until: "'Ready' in kubectl_status.stdout"
  retries: 15
  delay: 10

- name: Install Helm
  shell: |
    curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    chmod +x get_helm.sh
    ./get_helm.sh
  args:
    creates: /usr/local/bin/helm

- name: Verify Helm installation
  shell: helm version --short
  become: no
  register: helm_status
  until: "'v3' in helm_status.stdout"
  retries: 5
  delay: 10

- name: Add Prometheus Helm repo
  shell: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  become: no

- name: Update Helm repositories
  shell: helm repo update
  become: no

- name: Create monitoring namespace safely
  shell: |
    export KUBECONFIG="/home/{{ ansible_user }}/.kube/config"
    kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
  become: no

- name: Install or Upgrade kube-prometheus-stack via Helm
  shell: helm upgrade --install prometheus-stack prometheus-community/kube-prometheus-stack --namespace monitoring
  become: no