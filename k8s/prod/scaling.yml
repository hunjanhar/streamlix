apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamlix-app-hpa
  namespace: streamlix-app-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamlix-app-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
