apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: streamlix-app-monitor
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: streamlix-app
  namespaceSelector:
    matchNames:
      - streamlix-app-ns
  endpoints:
  - port: metrics
    path: /metrics
